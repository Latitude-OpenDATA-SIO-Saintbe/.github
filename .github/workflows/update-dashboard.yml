name: Update Dashboard

on:
  schedule:
    - cron: "0 0 * * *"  # Runs every day at midnight UTC
  workflow_dispatch:  # Allows you to manually trigger the workflow via the GitHub Actions UI
    inputs:
      update_dashboard:
        description: 'Update the dashboard'
        required: true
        default: 'yes'

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Ensure write access to repository contents

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '14'

    - name: Install dependencies
      run: |
        npm install axios

    - name: Fetch Repository Stats and Issues
      run: |
        node fetchStats.js  # Your custom script to update the README

    - name: Commit and push changes to the README
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        
        # Stage only README.md
        git add README.md
        
        # Commit only if there are changes
        git diff --cached --quiet || git commit -m "Updated repository stats and issues"
        
        # Push changes
        git push
