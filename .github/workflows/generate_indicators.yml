name: Generate Indicators

on:
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install matplotlib requests
    - name: Generate Graphs
      run: python generate_indicators.py
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Commit and Push
      run: |
        git config --global user.name 'github-actions'
        git config --global user.email 'github-actions@github.com'
        
        # Check if the files exist before adding them
        if [ -f "bug_status.png" ]; then
          git add bug_status.png
        fi
        if [ -f "workload_by_assignee.png" ]; then
          git add workload_by_assignee.png
        fi
        if [ -f "project_progress.png" ]; then
          git add project_progress.png
        fi
        
        git commit -m 'Update project indicators' || echo "No changes to commit"
        git push
